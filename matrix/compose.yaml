services:

  # ---------------------------------------------------------
  # CLOUDFLARE TUNNEL
  # ---------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    deploy:
      resources:
        limits:
          cpus: "2"

  # ---------------------------------------------------------
  # REDIS CACHE
  # ---------------------------------------------------------
  redis:
    image: docker.io/valkey/valkey:9
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"

  # ---------------------------------------------------------
  # POSTGRES DATABASE
  # ---------------------------------------------------------
  database:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    volumes:
      - ${BASE_PATH}/matrix/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C"
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4"

  # ---------------------------------------------------------
  # SYNAPSE - MATRIX HOMESERVER
  # ---------------------------------------------------------
  synapse:
    image: matrixdotorg/synapse:latest
    restart: unless-stopped
    volumes:
      - ${BASE_PATH}/matrix/synapse:/data
    environment:
      - SYNAPSE_SERVER_NAME=${MATRIX_SERVER_NAME}
      - SYNAPSE_REPORT_STATS=${SYNAPSE_REPORT_STATS:-no}
      - SYNAPSE_ENABLE_REGISTRATION=${SYNAPSE_ENABLE_REGISTRATION:-no}
      - SYNAPSE_LOG_LEVEL=${SYNAPSE_LOG_LEVEL:-INFO}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost:8008/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "4"

  # ---------------------------------------------------------
  # ELEMENT WEB CLIENT
  # ---------------------------------------------------------
  element-web:
    image: vectorim/element-web:latest
    restart: unless-stopped
    volumes:
      - ${BASE_PATH}/matrix/element/config.json:/app/config.json:ro
    healthcheck:
      test: curl -f http://localhost:80/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2"