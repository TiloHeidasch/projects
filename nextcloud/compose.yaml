services:
  # ---------------------------------------------------------
  # CLOUDFLARE TUNNEL
  # ---------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    deploy:
      resources:
        limits:
          cpus: "2"

  # ---------------------------------------------------------
  # REDIS BROKER
  # ---------------------------------------------------------
  broker:
    image: docker.io/valkey/valkey:9
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping || exit 1
    deploy:
      resources:
        limits:
          cpus: "2"

  # ---------------------------------------------------------
  # POSTGRES DATENBANK
  # ---------------------------------------------------------
  database:
    image: docker.io/library/postgres:14
    restart: unless-stopped
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_SUPERUSER_USER}
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD}
    healthcheck:
      test: pg_isready -U ${DB_SUPERUSER_USER} -d ${DB_DATABASE} || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4"

  # ---------------------------------------------------------
  # COLLABORA
  # ---------------------------------------------------------
  collabora:
    image: collabora/code:latest
    restart: unless-stopped
    environment:
      - aliasgroup1=${COLLABORA_ALIAS_GROUP}
      - DONT_GEN_SSL_CERT=YES
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true
    healthcheck:
      test: curl -f http://localhost:9980/hosting/discovery || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "4"

  # ---------------------------------------------------------
  # NEXTCLOUD
  # ---------------------------------------------------------
  nextcloud:
    image: nextcloud:latest
    restart: unless-stopped
    volumes:
      - ${NEXTCLOUD_DATA_LOCATION}:/var/www/html/data
      - ${NEXTCLOUD_CONFIG_LOCATION}:/var/www/html
    environment:
      - DB_DATABASE=${DB_DATABASE}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - NEXTCLOUD_DOMAIN=${NEXTCLOUD_DOMAIN}
      - NEXTCLOUD_INSTANCE_ID=${NEXTCLOUD_INSTANCE_ID}
      - NEXTCLOUD_PASSWORDSALT=${NEXTCLOUD_PASSWORDSALT}
      - NEXTCLOUD_SECRET=${NEXTCLOUD_SECRET}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_DOMAIN=${MAIL_DOMAIN}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_PORT=${MAIL_PORT}
    depends_on:
      database:
        condition: service_healthy
      broker:
        condition: service_healthy
      collabora:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost/status.php || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "7"