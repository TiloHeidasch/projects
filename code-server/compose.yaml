services:
  # ---------------------------------------------------------
  # CLOUDFLARE TUNNEL
  # ---------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    deploy:
      resources:
        limits:
          cpus: "2"

  # ---------------------------------------------------------
  # CODE-SERVER (VS Code in Browser)
  # ---------------------------------------------------------
  code-server:
    image: ghcr.io/coder/code-server:latest
    restart: unless-stopped
    user: "99:100"
    command: ["--bind-addr", "0.0.0.0:8080", "/home/coder/workspace"]
    volumes:
      - ${CODE_SERVER_CONFIG}:/home/coder/.config/code-server
      - ${CODE_SERVER_WORKSPACE}:/home/coder/workspace
      - ${CODE_SERVER_NPM_GLOBAL}:/home/coder/.npm-global
    ports:
      - 8443:8080
    environment:
      - TZ=${TZ}
      - NPM_CONFIG_PREFIX=/home/coder/.npm-global
    healthcheck:
      test: curl -f http://localhost:8080/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "7"