services:
  # ---------------------------------------------------------
  # DOZZLE - Docker Logs UI (Web UI :9999)
  # ---------------------------------------------------------
  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    ports:
      - "9999:8080"
    environment:
      - TZ=${TZ}
      # optional
      # - DOZZLE_FILTER=status=running
      # - DOZZLE_TAILSIZE=3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: curl -f http://localhost:8080/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2"
