services:
  # ---------------------------------------------------------
  # CLOUDFLARE TUNNEL
  # ---------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    deploy:
      resources:
        limits:
          cpus: "2"

  # ---------------------------------------------------------
  # MOSQUITTO
  # ---------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:latest
    restart: unless-stopped
    volumes:
      - ${MOSQUITTO_CONFIG_PATH}:/mosquitto/config
      - ${MOSQUITTO_DATA_PATH}:/mosquitto/data
    ports:
      - 1883:1883
      - 9001:9001
    networks:
      br0:
        ipv4_address: 10.0.254.4
    deploy:
      resources:
        limits:
          cpus: "2"

  # ---------------------------------------------------------
  # NODE-RED
  # ---------------------------------------------------------
  nodered:
    image: nodered/node-red:latest
    restart: unless-stopped
    volumes:
      - ${NODERED_DATA_PATH}:/data
    ports:
      - 1880:1880
    environment:
      - TZ=Europe/Berlin
      - NODE_RED_ENABLE_SAFE_MODE=false
      - USER_ID=${NODERED_USER_ID:-0}
      - GROUP_ID=${NODERED_GROUP_ID:-0}
    depends_on:
      mosquitto:
        condition: service_started
    healthcheck:
      test: curl -f http://localhost:1880/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"

networks:
  br0:
    external: true
