services:
  # ---------------------------------------------------------
  # OPENHANDS INIT
  # ---------------------------------------------------------
  openhands-init:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    volumes:
      - ${OPENHANDS_DATA_PATH}:/data
      - ${OPENHANDS_PROJECTS_PATH}:/projects
    command: chown -R 10001:10001 /data /projects
    deploy:
      resources:
        limits:
          cpus: "2"

  # ---------------------------------------------------------
  # OPENHANDS
  # ---------------------------------------------------------
  openhands:
    image: ghcr.io/openhands/agent-canvas:1.16.0
    restart: unless-stopped
    volumes:
      - ${OPENHANDS_DATA_PATH}:/home/openhands/.openhands
      - ${OPENHANDS_PROJECTS_PATH}:/projects
    ports:
      - "${OPENHANDS_PORT:-8000}:8000"
    environment:
      LOCAL_BACKEND_API_KEY: ${OPENHANDS_LOCAL_BACKEND_API_KEY}
      OH_SECRET_KEY: ${OPENHANDS_SECRET_KEY}
    depends_on:
      openhands-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:8000/server_info")
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "7"
