services:
  # ---------------------------------------------------------
  # CLOUDFLARE TUNNEL
  # ---------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    deploy:
      resources:
        limits:
          cpus: "2"

  # ---------------------------------------------------------
  # AnythingLLM
  # ---------------------------------------------------------
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    volumes:
      - ${ANYTHINGLLM_DATA_PATH}:/app/server/storage
      - ${ANYTHINGLLM_ENV_FILE}:/app/server/.env
    environment:
      STORAGE_DIR: /app/server/storage
    deploy:
      resources:
        limits:
          cpus: "4"
    healthcheck:
      test: curl -f http://localhost:3001/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s