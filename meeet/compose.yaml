services:
  # ---------------------------------------------------------
  # CLOUDFLARE TUNNEL
  # ---------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      meeet:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "2"

  # ---------------------------------------------------------
  # MEEET
  # ---------------------------------------------------------
  meeet:
    image: ${MEEET_IMAGE}
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${MEEET_SCHEDULE_HOST_DIR}
        target: /opt/meeet/schedule
        read_only: true
        bind:
          create_host_path: false
    environment:
      NODE_ENV: production
      MEEET_PROVIDER_MODE: configured
      MEEET_PROVIDER_DEPLOYMENT: managed
      MEEET_SCHEDULE_ARTIFACT_PATH: /opt/meeet/schedule/mvv-scheduled-artifact.json
    deploy:
      resources:
        limits:
          cpus: "7"
