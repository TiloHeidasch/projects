#      - UN_RADARR_0_API_KEY=${RADARR_KEY}
#      - UN_RADARR_0_TIMEOUT=10s

  # Jellyseerr - Media request management
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    init: true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${BASE_PATH}/jellyseerr/config:/app/config
    ports:
      - 5055:5055
    restart: unless-stopped
    healthcheck:
      test: curl -f http://localhost:5055/api/v1/status || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
