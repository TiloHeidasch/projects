#      - ${DOWNLOAD_PATH}:/downloads
#    restart: unless-stopped

  # SABnzbd - Usenet download client (routed through VPN)
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - HOST_WHITELIST_ENTRIES=${HOST_WHITELIST_ENTRIES}
    volumes:
      - ${BASE_PATH}/sabnzbd/config:/config
      - ${DOWNLOAD_PATH}:/downloads
    restart: unless-stopped
    healthcheck:
      test: curl -f http://localhost:8085/api?mode=version || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4"

  # Gluetun - VPN gateway for all outbound torrent/indexer traffic
  gluetun:
    image: qmcgaw/gluetun:v3
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    devices:
      - /dev/net/tun:/dev/net/tun
    healthcheck:
      test: ping -c 1 1.1.1.1 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-mullvad}
      - VPN_TYPE=${VPN_TYPE:-wireguard}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADD}
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES}
      - UPDATER_PERIOD=24h
      - WIREGUARD_MTU=${WIREGUARD_MTU:-1200}
      - VPN_PORT_FORWARDING=off
    ports:
      - 8191:8191/tcp   # FlareSolverr
      - 9696:9696/tcp   # Prowlarr
#      - 8080:8080/tcp   # qBittorrent WebUI
      - 8085:8085/tcp   # SABnzbd WebUI

